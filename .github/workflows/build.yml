name: Сборка установщиков

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  VERSION_NAME: '2.4.0'
  VERSION_CODE: '204'

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Ключ подписи
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"; else echo "::warning::нет ключа подписи"; fi
      - name: Сборка
        env: { ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' }
        run: gradle -p android assembleRelease assembleDebug --no-daemon --stacktrace
      - name: Подпись и файлы
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Muzyka-v$VERSION_NAME-Android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: out/ }

  android-test:
    name: Android ${{ matrix.api }} — проверка на эмуляторе
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: out }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Проверочная музыка и виртуальные колонки
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg pulseaudio > /dev/null
          bash ci/android_media.sh "$RUNNER_TEMP/music" windows/build/icon.png
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual || true
          pactl set-default-sink virtual || true
          pactl info | grep -i "default sink" || true
      - name: Эмулятор и сценарий
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_3a
          cores: 4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: bash ci/android_run.sh "$RUNNER_TEMP/music" out/app-debug.apk "out/Muzyka-v${{ env.VERSION_NAME }}-Android.apk" android-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'android-${{ matrix.api }}-screenshots', path: android-shots/ }

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Сборка
        working-directory: windows
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - name: Проверка программы (снимки экрана, воспроизведение, сохранение)
        working-directory: windows
        shell: bash
        run: |
          MUZ_SNAPSHOT="$GITHUB_WORKSPACE/windows-shots" "dist/win-unpacked/MuzykaOffline.exe" || true
          cat "$GITHUB_WORKSPACE/windows-shots/report.txt"
          grep -q "library saved: true" "$GITHUB_WORKSPACE/windows-shots/report.txt"
          grep -q '"title":"Example Domain"' "$GITHUB_WORKSPACE/windows-shots/report.txt"
          grep -q "browser closed: true" "$GITHUB_WORKSPACE/windows-shots/report.txt"
          grep -q '"s":"available"' "$GITHUB_WORKSPACE/windows-shots/report.txt"
          grep -q 'update downloaded: {"file"' "$GITHUB_WORKSPACE/windows-shots/report.txt"
      - name: Проверка установщика (тихая установка)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Get-Process MuzykaOffline -ErrorAction SilentlyContinue | Stop-Process -Force
          $setup = Get-ChildItem windows/dist/Muzyka-*-Setup.exe | Select-Object -First 1
          "Установщик: $($setup.Name), $([math]::Round($setup.Length / 1MB)) МБ" | Tee-Object -Append windows-shots/report.txt
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S', '/currentuser' -PassThru
          $exe = $null
          for ($i = 0; $i -lt 90 -and -not ($exe -and $p.HasExited); $i++) {
            Start-Sleep -Seconds 2
            if (-not $exe) { $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter MuzykaOffline.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          }
          "Установщик закончил работу: $($p.HasExited)" | Tee-Object -Append windows-shots/report.txt
          Get-Process | Where-Object { $_.ProcessName -like 'Muzyka*' } | Format-Table ProcessName, Id, Path -AutoSize | Out-String | Write-Host
          if (-not $exe) { throw 'программа не установилась' }
          "Установлено: $($exe.FullName)" | Tee-Object -Append windows-shots/report.txt
          $lnk = Get-ChildItem "$env:USERPROFILE\Desktop", "$env:PUBLIC\Desktop" -Filter *.lnk -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          "Ярлыки на рабочем столе: $lnk" | Tee-Object -Append windows-shots/report.txt
          Get-Process | Where-Object { $_.ProcessName -like 'Muzyka*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName out/
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: out/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-screenshots, path: windows-shots/ }

  macos:
    name: macOS (.dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Сборка (Apple silicon + Intel)
        run: |
          XC=$(ls -d /Applications/Xcode*.app | python3 -c "import sys,re; l=[x.strip() for x in sys.stdin if 'beta' not in x.lower()]; print(max(l, key=lambda s: [int(n) for n in re.findall(r'\d+', s)] or [0]))")
          export DEVELOPER_DIR="$XC/Contents/Developer"
          echo "Xcode: $XC"; swiftc --version
          ARCHS="arm64 x86_64" bash MusicCraft/build.sh
          bash MusicCraft/make_dmg.sh "$PWD/out"
      - name: Проверка
        run: |
          APP="Музыка в офлайн.app"
          lipo -info "$APP/Contents/MacOS/MuzykaOffline"
          codesign --verify --verbose "$APP"
          hdiutil attach out/*.dmg -mountpoint /tmp/muz -nobrowse
          ls -la /tmp/muz
          test -d "/tmp/muz/Музыка в офлайн.app"
          hdiutil detach /tmp/muz
      - uses: actions/upload-artifact@v4
        with: { name: macos-dmg, path: out/ }

  release:
    name: Выпуск на GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, android-test, windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Выпуск
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p files
          cp art/android-apk/Muzyka-*.apk art/windows-exe/*.exe art/macos-dmg/*.dmg files/
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* --title "Музыка в офлайн $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
